{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود</title>
</head>
<body>
    
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h2 class="text-center">ورود</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">ورود</button>
                </form>
                <p class="mt-3 text-center">ثبت‌نام نکردی؟ <a href="/accounts/signup/">ثبت‌نام</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
