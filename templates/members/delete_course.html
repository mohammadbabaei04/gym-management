{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حذف دوره</title>
</head>
<body>
    {% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body">
                <h2 class="text-danger">⚠️ حذف دوره</h2>
                <p>آیا از حذف دوره <strong>{{ course.name }}</strong> مطمئن هستی؟</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">🗑️ بله، حذف کن</button>
                    <a href="{% url 'members:course_detail' course.id %}" class="btn btn-secondary">🔙 بازگشت</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
