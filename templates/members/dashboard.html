{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% block content %}
    <h1 class="text-center mb-4">📊 داشبورد مدیریت</h1>

    <div class="row">
        <div class="col-md-3">
            <div class="card text-white bg-primary">
                <div class="card-body text-center">
                    <h5>👥 اعضا</h5>
                    <h2>{{ members_count }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success">
                <div class="card-body text-center">
                    <h5>📋 دوره‌ها</h5>
                    <h2>{{ courses_count }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning">
                <div class="card-body text-center">
                    <h5>📝 ثبت‌نام‌ها</h5>
                    <h2>{{ registrations }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-danger">
                <div class="card-body text-center">
                    <h5>🎫 تیکت‌های باز</h5>
                    <h2>{{ tickets_count }}</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card text-white bg-dark">
                <div class="card-body text-center">
                    <h5>💰 درآمد کل</h5>
                    <h2>{{ total_income }} تومان</h2>
                </div>
            </div>
        </div>
    </div>
    {% endblock %}
</body>
</html>
