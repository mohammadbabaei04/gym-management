<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام دوره</title>
</head>
<body>
    <h2>📝 ثبت‌نام در دوره {{ course.name }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">✅ ثبت‌نام</button>
    </form>
    <a href="{% url 'members:course_detail' course.id %}">🔙 بازگشت</a>
</body>
</html>
